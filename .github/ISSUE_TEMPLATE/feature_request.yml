name: Feature request
description: Suggest an improvement for Sauna Suite.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: Please describe the use case before the implementation idea.
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should Sauna Suite behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternatives or tradeoffs.
